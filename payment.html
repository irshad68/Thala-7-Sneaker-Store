<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Thala 7</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">Thala <span>7</span></a>

            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Brands</a></li>
                <li><a href="#">More</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="nav-icons">
                <a href="#">⌕</a>
                <a href="cart.html">🛒</a>
                <a href="#" class="profile">●</a>
            </div>

        </nav>
    </header>


    <main class="checkout-page">

        <p class="checkout-label">Checkout</p>

        <section class="checkout-layout">

            <!-- LEFT -->

            <div class="payment-left">

                <h2>Contact Details</h2>

                <label for="email">Email ID</label>

                <input type="email" id="email" class="email-input" placeholder="Enter your email">


                <h2 class="payment-heading">Payment</h2>


                <div class="payment-methods">

                    <div class="method active">
                        <span>▣</span>
                        <p>Card</p>
                    </div>

                    <div class="method">
                        <span>₿</span>
                        <p>Crypto</p>
                    </div>

                    <div class="method">
                        <span>▥</span>
                        <p>Bank</p>
                    </div>

                </div>


                <div class="card-form">

                    <label for="card">Card Number</label>

                    <input type="text" id="card" placeholder="1234 5678 9012 3456">


                    <div class="form-row">

                        <div>
                            <label for="expiry">Expiry</label>
                            <input type="text" id="expiry" placeholder="MM/YY">
                        </div>

                        <div>
                            <label for="cvc">CVC</label>
                            <input type="text" id="cvc" placeholder="123">
                        </div>

                    </div>


                    <div class="form-row">

                        <div>
                            <label for="country">Country</label>

                            <select id="country">
                                <option>India</option>
                                <option>USA</option>
                                <option>UK</option>
                            </select>
                        </div>

                        <div>
                            <label for="zip">ZIP</label>

                            <input type="text" id="zip" placeholder="226001">
                        </div>

                    </div>

                </div>

            </div>


            <!-- RIGHT -->

            <div class="summary-card checkout-summary">

                <h2>Order Summary</h2>

                <label for="checkout-coupon">
                    Enter Coupon Code
                </label>

                <div class="coupon">

                    <input type="text" id="checkout-coupon" placeholder="COUPON CODE">

                    <button>Apply Coupon</button>

                </div>


                <div class="summary-row">
                    <span>Sub Total</span>
                    <span>₹4,999</span>
                </div>

                <div class="summary-row">
                    <span>Taxes</span>
                    <span>₹199</span>
                </div>

                <div class="summary-row">
                    <span>Discount</span>
                    <span>₹199</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹4,999</span>
                </div>


                <button class="pay-btn">
                    Pay Now ₹4,999
                </button>


                <div class="payment-icons">
                    <span>🔒 SECURE</span>
                    <strong>Razorpay</strong>
                    <span>✓ VERIFIED</span>
                </div>

            </div>

        </section>

    </main>

</body>

</html>
